<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#b40000">
  <title>تنبيه تذاكر الأهلي</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0f1115;
      color:#fff
    }

    .wrap{
      max-width:560px;
      margin:auto;
      padding:22px
    }

    .card{
      background:#181b22;
      border:1px solid #2a2f38;
      border-radius:20px;
      padding:20px;
      margin:14px 0
    }

    h1{
      margin:0 0 8px;
      font-size:28px
    }

    h3{
      margin-top:0
    }

    p{
      color:#bfc5cf;
      line-height:1.7
    }

    button,a{
      display:block;
      width:100%;
      padding:14px;
      border:0;
      border-radius:14px;
      text-align:center;
      text-decoration:none;
      font-weight:700;
      font-size:16px;
      margin-top:10px;
      cursor:pointer
    }

    .primary{
      background:#b40000;
      color:#fff
    }

    .secondary{
      background:#2a2f38;
      color:#fff
    }

    .status{
      padding:12px;
      border-radius:12px;
      background:#222732;
      margin-top:12px;
      line-height:1.8
    }

    .ok{
      color:#72e6a2
    }

    .warn{
      color:#ffd166
    }

    .err{
      color:#ff7777
    }

    .info{
      color:#66b3ff
    }

    small{
      color:#8e96a3;
      line-height:1.7
    }

  </style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>🔴 تنبيه تذاكر الأهلي</h1>

    <p>
      فعّل الإشعارات وسيتم تنبيهك عند اكتشاف توفر تذاكر
      للمباراة التي تتم مراقبتها.
    </p>

    <button id="notifyBtn" class="primary">
      🔔 تفعيل الإشعارات
    </button>

    <a
      class="secondary"
      href="https://www.tazkarti.com/#/matches"
      target="_blank"
      rel="noopener"
    >
      فتح تذكرتي
    </a>

    <div id="status" class="status">
      جاري التحقق من الإشعارات...
    </div>

  </div>


  <div class="card">

    <h3>🔴 حالة مراقبة الأهلي</h3>

    <div id="monitorStatus" class="status">
      جاري استلام حالة المراقبة...
    </div>

    <small>
      هذه الصفحة تعرض آخر حالة فعلية لمراقبة تذاكر الأهلي.
    </small>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

import {
  getMessaging,
  getToken,
  isSupported
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-messaging.js";


const firebaseConfig = {

  apiKey: "AIzaSyAvv8yaOM_OITgKRcpe0xZD6AOv1oDyvTc",

  authDomain: "alahly-ticket-alert.firebaseapp.com",

  projectId: "alahly-ticket-alert",

  storageBucket: "alahly-ticket-alert.firebasestorage.app",

  messagingSenderId: "268954365381",

  appId: "1:268954365381:web:7d8b3a7bfda8d9e422efac"

};


const VAPID_KEY =
  "BAYxVRbvvtkasJKgnU0Ja62KhC7aqsjv2JBEdrinMHc0NywavCwCfucZfX00mq8UMYDe7jV-gLzMijc9ABAlVYQ";


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


const statusEl =
  document.getElementById("status");


const monitorEl =
  document.getElementById("monitorStatus");


const btn =
  document.getElementById("notifyBtn");


function setStatus(text, cls = "") {

  statusEl.className =
    "status " + cls;

  statusEl.textContent =
    text;

}


/*
  تفعيل إشعارات الهاتف
*/

btn.addEventListener("click", async () => {

  try {

    if (!("Notification" in window)) {

      throw new Error(
        "المتصفح لا يدعم إشعارات الويب."
      );

    }


    const supported =
      await isSupported();


    if (!supported) {

      throw new Error(
        "إشعارات Firebase غير مدعومة في هذا المتصفح."
      );

    }


    const permission =
      await Notification.requestPermission();


    if (permission !== "granted") {

      throw new Error(
        "لم يتم السماح بالإشعارات."
      );

    }


    const registration =
      await navigator.serviceWorker.register(
        "/firebase-messaging-sw.js",
        {
          scope: "/"
        }
      );


    const messaging =
      getMessaging(app);


    const token =
      await getToken(
        messaging,
        {
          vapidKey: VAPID_KEY,
          serviceWorkerRegistration: registration
        }
      );


    if (!token) {

      throw new Error(
        "تعذر الحصول على رمز الإشعارات."
      );

    }


    await setDoc(
      doc(db, "pushSubscriptions", token),
      {
        createdAt: Date.now(),
        userAgent: navigator.userAgent
      }
    );


    setStatus(
      "تم تفعيل الإشعارات على هذا الجهاز ✅",
      "ok"
    );


  } catch (e) {

    console.error(e);

    setStatus(
      e.message ||
      "حدث خطأ أثناء تفعيل الإشعارات.",
      "err"
    );

  }

});


/*
  قراءة حالة المراقبة الفعلية للأهلي
*/

onSnapshot(
  doc(db, "monitorState", "alahly"),
  snap => {

    if (!snap.exists()) {

      monitorEl.innerHTML =
        '<span class="warn">🟡 لم يتم إجراء فحص اختبار حتى الآن.</span>';

      return;

    }


    const d =
      snap.data();


    let time =
      "غير معروف";


    if (d.checkedAt?.toDate) {

      time =
        d.checkedAt
          .toDate()
          .toLocaleString("ar-EG");

    }


    let html = "";


    /*
      هل تم العثور على مباراة مصر؟
    */

    if (d.teamFound) {

      html +=
        '<span class="ok">🇪🇬 🟢 تم العثور على مباراة مصر.</span><br>';

    } else {

      html +=
        '<span class="warn">🇪🇬 🟡 لم يتم العثور على مباراة مصر في آخر فحص.</span><br>';

    }


    /*
      هل يوجد توفر للتذاكر؟
    */

    if (d.available) {

      html +=
        '<span class="ok">🎟️ 🟢 تم اكتشاف توفر محتمل للتذاكر.</span><br>';

    } else {

      html +=
        '<span class="warn">🎟️ 🟡 لا يوجد توفر مؤكد حاليًا.</span><br>';

    }


    html +=
      '<span class="info">🕐 آخر فحص: ' +
      time +
      '</span>';


    monitorEl.innerHTML =
      html;

  }

);

</script>

</body>
</html>
