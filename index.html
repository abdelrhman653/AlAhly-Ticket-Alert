<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تنبيه تذاكر الفرق المصرية والمنتخب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --warning: #eab308;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-box {
            position: relative;
            margin-bottom: 12px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--primary);
        }
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .team-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-align: right;
        }
        .team-btn:hover, .team-btn.active {
            border-color: var(--primary);
            background: rgba(220, 38, 38, 0.1);
        }
        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .match-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .match-item.selected {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.1);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .status-badge.active { background: rgba(34, 197, 94, 0.15); color: var(--accent); }
        .status-badge.pending { background: rgba(234, 179, 8, 0.15); color: var(--warning); }
        .status-badge.blocked { background: rgba(220, 38, 38, 0.15); color: var(--primary); }
        
        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background: var(--primary-dark);
        }
        .notification-status-box {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔴 Ticket Alert Egypt</h1>
            <p>راقب تذاكر فريقك المفضلة ومنتخب مصر وكن أول من يعلم</p>
        </header>

        <!-- اختيار الفريق -->
        <div class="card">
            <div class="section-title"><i class="fa-solid fa-shield-halved"></i> ماذا تريد أن تراقب؟</div>
            <div class="search-box">
                <input type="text" id="teamSearch" placeholder="ابحث عن فريق أو منتخب...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="teams-grid" id="popularTeams">
                <button class="team-btn" data-team="الأهلي">🔴 الأهلي</button>
                <button class="team-btn" data-team="الزمالك">⚪ الزمالك</button>
                <button class="team-btn" data-team="المصري">🟢 المصري</button>
                <button class="team-btn" data-team="بيراميدز">🔵 بيراميدز</button>
                <button class="team-btn" data-team="منتخب مصر">🇪🇬 منتخب مصر</button>
            </div>
        </div>

        <!-- اختيار المباراة -->
        <div class="card" id="matchesCard" style="display:none;">
            <div class="section-title"><i class="fa-solid fa-futbol"></i> مباريات الفريق المتاحة</div>
            <div class="matches-list" id="matchesList">
                <!-- يتم تعبئتها ديناميكياً -->
            </div>
        </div>

        <!-- حالة الإشعارات -->
        <div class="card">
            <div class="section-title"><i class="fa-solid fa-bell"></i> حالة الإشعارات</div>
            <div id="notificationArea" class="notification-status-box">
                جاري التحقق من الإشعارات...
            </div>
        </div>

        <!-- حالة المراقبة النشطة -->
        <div class="card">
            <div class="section-title"><i class="fa-solid fa-chart-line"></i> حالة المراقبة</div>
            <div id="monitoringStatus" style="font-size: 0.9rem; color: var(--text-muted);">
                لم يتم تحديد فريق للمراقبة بعد.
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="monitor.js"></script>
</body>
</html>
